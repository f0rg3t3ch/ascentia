  <head>

    <link rel="icon" type="image/svg+xml" href="https://f0rg3t3ch.github.io/ascentia/favicon.svg" />
    <!--
      GitHub Pages serves this for any unknown path, at any depth, so every
      URL here is absolute and the page carries its own styles. If the origin
      changes, rewrite the favicon and both home-page links.
      It cannot know which language the visitor wanted, so it says it twice.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #F7D2BF;
        color: #23343B;
        font-family: ui-rounded, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 34rem; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.2; margin: 0 0 1rem; color: #0F5F78; }
      p { font-size: 1.0625rem; line-height: 1.7; margin: 0 0 1.5rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a {
        display: inline-flex;
        padding: 0.875rem 1.75rem;
        border-radius: 999px;
        background: #0F5F78;
        color: #FFF8F2;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #23343B; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stranica nije pronađena</h1>

      <div class="actions">
        <a href="https://f0rg3t3ch.github.io/ascentia/">Natrag na naslovnicu</a>
        <a lang="en" href="https://f0rg3t3ch.github.io/ascentia/en/">Go to the home page</a>
      </div>
    </main>
  </body>
</html>
